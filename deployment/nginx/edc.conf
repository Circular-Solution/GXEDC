# Replace consumer.edc.example.com / provider.edc.example.com with your own hostnames,
# and the allow directives with the IP of your platform backend.
#
# NodePorts are pinned in terraform: consumer = 32000 + offset, provider = 32100 + offset
#   +81 management   +82 dsp   +92 dataplane public   +71 ih identity   +72 ih credentials   +73 ih did

# Consumer EDC
server {
  listen 443 ssl;
  server_name consumer.edc.example.com;

  ssl_certificate /etc/letsencrypt/live/consumer.edc.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/consumer.edc.example.com/privkey.pem;

  location /api/dsp/ {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Api-Key, Authorization';
      add_header 'Access-Control-Max-Age' 86400;
      return 204;
    }
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Api-Key, Authorization' always;
    proxy_pass http://127.0.0.1:32082/api/dsp/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/public {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Api-Key, Authorization';
      add_header 'Access-Control-Max-Age' 86400;
      return 204;
    }
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Api-Key, Authorization' always;
    proxy_pass http://127.0.0.1:32092/api/public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/credentials/ {
    proxy_pass http://127.0.0.1:32072/api/credentials/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OID4VCI requires well-known metadata at the host root, before the issuer path
  location ~ ^/\.well-known/(openid-credential-issuer|oauth-authorization-server)/api/credentials/(.*)$ {
    proxy_pass http://127.0.0.1:32072/api/credentials/.well-known/$1/$2;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /.well-known/did.json {
    proxy_pass http://127.0.0.1:32073/.well-known/did.json;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # admin surfaces: restrict to the platform backend
  location /api/management/ {
    allow 1.2.3.4;
    deny all;
    proxy_pass http://127.0.0.1:32081/api/management/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/identity/ {
    allow 1.2.3.4;
    deny all;
    proxy_pass http://127.0.0.1:32071/api/identity/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

